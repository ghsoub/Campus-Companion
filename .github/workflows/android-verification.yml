name: Android verification

on:
  push:
    branches: [feature/campus-events-feed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install required Android SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Build and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain testDebugUnitTest assembleDebug
      - name: Upload test evidence and debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campus-events-verification
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
